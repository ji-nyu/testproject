[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testproject"
version = "0.1.0"
description = "Intentional doc-code drift demo for capstone scanner"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["testproject*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
